<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForestVision</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>🌲 ForestVision</h1>

    <p class="subtitle">
        AI-Based Forest vs Non-Forest Image Classification
    </p>

    <div class="card">

        <input type="file" id="imageInput" accept="image/*">

        <button id="predictBtn">
            Classify Image
        </button>

        <div id="result">
            Upload an image and click <b>Classify Image</b>.
        </div>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
